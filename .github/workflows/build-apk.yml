name: Build SISA Cotizador APK

on:
  push:
    branches: [sisa-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            sisa_build_parts/part_00.b64 \
            sisa_build_parts/part_01x0.b64 \
            sisa_build_parts/part_01x1.b64 \
            sisa_build_parts/part_01x2.b64 \
            sisa_build_parts/part_01x3.b64 \
            sisa_build_parts/part_01x4.b64 \
            sisa_build_parts/part_01x5.b64 \
            sisa_build_parts/part_01x5z.b64 \
            sisa_build_parts/part_02.b64 \
            sisa_build_parts/part_03.b64 \
            sisa_build_parts/part_04.b64 \
            sisa_build_parts/part_05a.b64 \
            sisa_build_parts/part_05b.b64 \
            sisa_build_parts/part_05c.b64 \
            sisa_build_parts/part_06a.b64 \
            sisa_build_parts/part_06b.b64 > sisa_project.b64
          test "$(wc -c < sisa_project.b64)" -eq 117740
          base64 --decode sisa_project.b64 > SISA_Cotizador_Android_v1.0_Proyecto.zip
          echo "4aaa64b2c9e2b5c280223ecef3f14211f5d048bb135f6a5e9ff6742fef374523  SISA_Cotizador_Android_v1.0_Proyecto.zip" | sha256sum -c -
          unzip -t SISA_Cotizador_Android_v1.0_Proyecto.zip
          unzip -q SISA_Cotizador_Android_v1.0_Proyecto.zip
          test -f SISA_Cotizador_APK_Project/app/build.gradle

      - name: Build debug APK
        working-directory: SISA_Cotizador_APK_Project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare installer
        shell: bash
        run: |
          set -euxo pipefail
          cp SISA_Cotizador_APK_Project/app/build/outputs/apk/debug/app-debug.apk SISA-Cotizador-v1.0.apk
          ls -lh SISA-Cotizador-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SISA-Cotizador-v1.0
          path: SISA-Cotizador-v1.0.apk
          if-no-files-found: error
          retention-days: 30
