name: Build SISA Cotizador APK

on:
  push:
    branches: [sisa-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SISA-Cotizador-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SISA-Cotizador-v1.0
          path: SISA-Cotizador-v1.0.apk
          if-no-files-found: error
