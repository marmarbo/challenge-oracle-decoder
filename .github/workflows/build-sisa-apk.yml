name: Build SISA Cotizador APK

on:
  push:
    branches:
      - sisa-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euxo pipefail
          cat sisa_build_parts/part_*.b64 > sisa_project.b64
          base64 --decode sisa_project.b64 > SISA_Cotizador_Android_v1.0_Proyecto.zip
          unzip -t SISA_Cotizador_Android_v1.0_Proyecto.zip
          unzip -q SISA_Cotizador_Android_v1.0_Proyecto.zip
          test -f SISA_Cotizador_APK_Project/app/build.gradle

      - name: Build debug APK
        working-directory: SISA_Cotizador_APK_Project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare installer
        shell: bash
        run: |
          set -euxo pipefail
          cp SISA_Cotizador_APK_Project/app/build/outputs/apk/debug/app-debug.apk SISA-Cotizador-v1.0.apk
          ls -lh SISA-Cotizador-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SISA-Cotizador-v1.0-APK
          path: SISA-Cotizador-v1.0.apk
          if-no-files-found: error
          retention-days: 30
